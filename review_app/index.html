<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>イラストの確認 · 100投稿パイロット</title>
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">◈</span><div><h1>イラストの確認</h1><p id="run-name">画像とAIの判定を、見比べる。</p></div></div>
    <div class="top-actions"><span id="progress" class="progress">読み込み中</span><span id="save-state" role="status">このPCに自動保存</span><button id="export" class="quiet">確認結果をダウンロード</button></div>
  </header>
  <div id="error" class="error-banner" role="alert" hidden><span id="error-message"></span><button id="retry">保存を再試行</button></div>
  <div id="loading" class="loading">100投稿の画像と判定を準備しています…</div>
  <main id="app" hidden>
    <aside class="sidebar">
      <div class="side-top"><div class="eyebrow">PILOT REVIEW <span id="total-count">100 POSTS</span></div><button id="sample" class="sample-button">ランダムに10投稿だけ見る <span>↗</span></button><button id="reset-sample" class="text-button" hidden>すべての投稿に戻す</button>
      <label class="sr-only" for="filter">確認状態で絞り込み</label><select id="filter"><option value="all">すべての投稿</option><option value="pending">未確認</option><option value="issue">気になる</option><option value="hold">保留</option><option value="ok">合ってそう</option></select>
      <label class="sr-only" for="search">投稿IDで検索</label><input id="search" placeholder="投稿IDで検索" type="search" autocomplete="off"><div id="list-count" class="muted"></div></div>
      <nav id="post-list" aria-label="投稿一覧"></nav>
      <div class="side-footer">少しだけの確認でもOK。<br>途中で閉じても続きから見られます。</div>
    </aside>
    <section class="workspace">
      <div class="post-toolbar"><div><span id="post-position" class="post-position"></span><a id="post-link" target="_blank" rel="noopener noreferrer">元の投稿 ↗</a></div><div class="nav-buttons"><button id="previous" title="前の投稿（←）">←</button><button id="next" title="次の投稿（→）">→</button></div></div>
      <div id="empty" hidden>該当する投稿はありません。絞り込みを変更してください。</div>
      <div id="comparison" class="comparison">
        <section class="image-column" aria-label="元画像">
          <div class="image-toolbar"><span id="image-number"></span><button id="zoom" class="quiet">画像を拡大 ↗</button></div>
          <button id="image-stage" class="image-stage" aria-label="画像を拡大"><img id="main-image" alt="確認する投稿画像"></button>
          <div id="image-load-error" class="image-load-error" hidden>画像を読み込めませんでした。再読み込みしてください。</div>
          <div id="image-thumbs" class="image-thumbs" aria-label="投稿内の画像を選択"></div>
          <p class="image-hint">画像をクリックして拡大 <span>／</span> <kbd>←</kbd><kbd>→</kbd> で投稿を移動</p>
        </section>
        <section class="labels-column" aria-label="テラの判定">
          <div class="labels-heading"><div class="eyebrow">TERRA’S LABELS</div><h2>AIはこう判定しました</h2><p>気になる項目の旗を押すと、メモとして残せます。</p></div>
          <div id="labels"></div>
        </section>
      </div>
      <footer id="review-footer" class="review-footer">
        <div class="note-row"><label for="note">ひとことメモ <span>任意</span></label><input id="note" maxlength="5000" placeholder="例：髪が赤ではなく茶色に見える" autocomplete="off"><span id="flag-count"></span></div>
        <div class="decision-row"><div class="decisions"><button id="mark-ok" class="decision ok">✓ 合ってそう <kbd>1</kbd></button><button id="mark-issue" class="decision issue">⚑ 気になる <kbd>2</kbd></button><button id="mark-hold" class="decision hold">保留 <kbd>3</kbd></button><button id="mark-pending" class="text-button">判定を外す</button></div><label class="auto-next"><input id="auto-next" type="checkbox" checked>判定したら次へ</label></div>
        <p id="review-status" class="review-status"></p>
      </footer>
    </section>
  </main>
  <dialog id="zoom-dialog"><div class="zoom-toolbar"><span>元画像の拡大表示</span><button id="zoom-size">原寸で見る</button><button id="close-zoom">閉じる ×</button></div><div class="zoom-scroll"><img id="zoom-image" alt="拡大した投稿画像"></div></dialog>
</body></html>
